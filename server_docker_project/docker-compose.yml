services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: pass
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      BASIC_HOST: 0.0.0.0
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: pass
      DB_NAME: postgres
    depends_on:
      - db

volumes:
  pgdata: 
